name: Public Windows validation

on:
  pull_request:
  workflow_dispatch:
    inputs:
      windows_smoke:
        description: Run one bounded Windows build and smoke test on a release branch
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-ci
  cancel-in-progress: false

jobs:
  public-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run public-source hygiene checks
        run: ./scripts/check-public-hygiene.sh --history
      - name: Validate source-declared Windows package revisions
        run: bash tests/windows/package-revision-test.sh
      - name: Validate release artifact identity and transport gates
        run: python3 tests/windows/release-assets-test.py
      - name: Validate release preflight gates
        run: python3 tests/windows/release-preflight-test.py
      - name: Validate packaged process-instance semantics
        run: bash tests/windows/package-process-identity-test.sh
      - name: Compile shared startup code on Linux
        # Supply the legacy port annotations and native LP64 aliases while
        # leaving _WIN32 undefined, so Windows-only startup code must be guarded.
        run: |
          cc -std=gnu11 -Werror=implicit-function-declaration -DREDIS_STATIC= \
            -include src/Win32_Interop/Win32_Portability.h \
            -DPORT_LONGLONG='long long' -DPORT_LONG=long -DPORT_ULONG='unsigned long' \
            -Ideps/hiredis -Ideps/linenoise -Ideps/lua/src \
            -Ideps/hdr_histogram -Ideps/fpconv \
            -c src/server.c -o "$RUNNER_TEMP/redis-server-startup.o"

  mingw-smoke:
    needs: public-hygiene
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_smoke && startsWith(github.ref, 'refs/heads/release-') }}
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preserve repository bytes for MSYS2 Git
        shell: pwsh
        run: |
          git config --local core.autocrlf false
          git config --local core.eol lf
          git config --local core.filemode false
          git reset --hard HEAD
          if ($LASTEXITCODE -ne 0) {
            throw 'Git reset failed while restoring the exact source checkout.'
          }
          $dirty = @(git status --porcelain --untracked-files=normal)
          if ($LASTEXITCODE -ne 0) {
            throw 'Git status failed while checking the restored checkout.'
          }
          if ($dirty.Count -ne 0) {
            $dirty | Write-Error
            throw 'The exact source checkout is not clean after byte restoration.'
          }
      - name: Set up MSYS2 MinGW64
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-tcl
            mingw-w64-x86_64-zstd

      - name: Normalize source bytes for MSYS2 Git
        shell: msys2 {0}
        run: |
          set -euo pipefail
          git config --local core.autocrlf false
          git config --local core.eol lf
          git config --local core.filemode false
          git reset --hard HEAD
          dirty="$(git status --porcelain --untracked-files=normal)"
          if [[ -n "$dirty" ]]; then
            printf '%s\n' "$dirty" >&2
            echo 'The MSYS2 Git checkout is not clean after byte normalization.' >&2
            exit 1
          fi

      - name: Build MinGW64 core and interop targets
        run: |
          ./build-mingw.sh -j2
          make -f Makefile.mingw interop-test
      - name: Run focused Redis tests
        run: >-
          ./runtest-mingw.sh --clients 1 --quiet --timeout 120
          --single unit/type/string --single unit/printver
      - name: Run Windows CPU affinity tests
        run: ./build/mingw64/redis-affinity-test.exe
      - name: Audit executable hardening
        run: bash tests/windows/pe-hardening.sh build/mingw64
      - name: Run Windows interop test
        run: |
          ./build/mingw64/interop-test.exe --legacy
          ./build/mingw64/interop-test.exe --modern
