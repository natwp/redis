name: Publish Windows release

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Canonical branch to publish (7.4 is intentionally excluded)
        required: true
        type: choice
        options:
          - mingw-8.10
          - mingw-8.8
          - mingw-7.2
          - mingw-6.2
      source_sha:
        description: Exact 40-character tip SHA to qualify and release
        required: true
        type: string
      windows_revision:
        description: Positive Windows package revision (new upstream release starts at 1)
        required: true
        default: '1'
        type: string
      confirm_tag:
        description: Type the exact expected vX.Y.Z-windows.N tag
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-ci
  cancel-in-progress: false

jobs:
  preflight:
    # Keep the release-branch guard when the hold is lifted.
    if: ${{ false && startsWith(github.ref, 'refs/heads/release-') }}
    name: Verify release policy and maintained-line barrier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_branch: ${{ steps.policy.outputs.source_branch }}
      source_sha: ${{ steps.policy.outputs.source_sha }}
      source_tree: ${{ steps.policy.outputs.source_tree }}
      version: ${{ steps.policy.outputs.version }}
      revision: ${{ steps.policy.outputs.revision }}
      tag: ${{ steps.policy.outputs.tag }}
      gate_json: ${{ steps.policy.outputs.gate_json }}
      qualification_run_id: ${{ steps.policy.outputs.qualification_run_id }}
      artifact_name: ${{ steps.policy.outputs.artifact_name }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check exact source, version, tag, and all maintained-line tips
        id: policy
        shell: bash
        env:
          INPUT_SOURCE_BRANCH: ${{ inputs.source_branch }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_WINDOWS_REVISION: ${{ inputs.windows_revision }}
          INPUT_CONFIRM_TAG: ${{ inputs.confirm_tag }}
        run: |
          set -euo pipefail
          branch="$INPUT_SOURCE_BRANCH"
          source_sha="$INPUT_SOURCE_SHA"
          revision="$INPUT_WINDOWS_REVISION"
          confirm_tag="$INPUT_CONFIRM_TAG"
          case "$branch" in
            mingw-8.10) expected_version=8.10.2 ;;
            mingw-8.8) expected_version=8.8.3 ;;
            mingw-7.2) expected_version=7.2.16 ;;
            mingw-6.2) expected_version=6.2.24 ;;
            *) echo '7.4 and non-canonical branches are not release eligible' >&2; exit 1 ;;
          esac
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_sha must be exactly 40 lowercase hex characters' >&2; exit 1; }
          [[ "$revision" =~ ^[1-9][0-9]*$ ]] || { echo 'windows_revision must be a positive integer' >&2; exit 1; }
          [[ "$GITHUB_REF_TYPE" == branch ]] || {
            echo "run this workflow from a branch, not ${GITHUB_REF_TYPE:-an unknown ref}" >&2
            exit 1
          }
          branch_tip="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha')"
          [[ "$branch_tip" == "$source_sha" ]] || { echo "source_sha is not current tip of $branch" >&2; exit 1; }
          if [[ "$GITHUB_REF_NAME" == "$branch" ]]; then
            [[ "$GITHUB_SHA" == "$source_sha" ]] || {
              echo "workflow source $GITHUB_SHA does not match requested release source $source_sha" >&2
              exit 1
            }
          else
            [[ "$GITHUB_REF_NAME" == release/control-* ]] || {
              echo "workflow must run from $branch or a release/control-* ref" >&2
              exit 1
            }
            comparison="$(gh api "/repos/${GITHUB_REPOSITORY}/compare/${source_sha}...${GITHUB_SHA}")"
            [[ "$(jq -r '.status' <<<"$comparison")" == ahead ]] || {
              echo 'release control ref must be a descendant of the exact release source' >&2
              exit 1
            }
            mapfile -t control_files < <(jq -r '.files[]?.filename' <<<"$comparison")
            [[ ${#control_files[@]} -eq 1 && "${control_files[0]}" == '.github/workflows/release.yml' ]] || {
              echo 'release control ref may change only .github/workflows/release.yml' >&2
              exit 1
            }
          fi
          version="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/src/version.h?ref=${source_sha}" --jq '.content' | tr -d '\n' | base64 -d | sed -n 's/^#define REDIS_VERSION "\([^"]*\)"/\1/p')"
          [[ "$version" == "$expected_version" ]] || { echo "expected $expected_version at $source_sha, found $version" >&2; exit 1; }
          source_revision="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/packaging/mingw/windows-revision?ref=${source_sha}" --jq '.content' | tr -d '\n' | base64 -d)"
          [[ "$source_revision" =~ ^[1-9][0-9]*$ && "$revision" == "$source_revision" ]] || {
            echo 'windows_revision does not match the source-declared package revision' >&2
            exit 1
          }
          source_tree="$(gh api "/repos/${GITHUB_REPOSITORY}/git/commits/${source_sha}" --jq '.tree.sha')"
          [[ "$source_tree" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(gh api "/repos/${GITHUB_REPOSITORY}/immutable-releases" --jq '.enabled')" == true ]] || {
            echo 'immutable releases must be enabled before publication' >&2; exit 1;
          }
          tag="v${version}-windows.${revision}"
          [[ "$confirm_tag" == "$tag" ]] || { echo "confirm_tag must equal $tag" >&2; exit 1; }
          if gh release view --repo "$GITHUB_REPOSITORY" "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; refusing to requalify it" >&2
            exit 1
          fi
          if gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >"$RUNNER_TEMP/preflight-tag.json" 2>/dev/null; then
            echo "tag $tag already exists; the release workflow must create it after attestation" >&2
            exit 1
          fi
          lines=(mingw-8.10 mingw-8.8 mingw-7.4 mingw-7.2 mingw-6.2)
          gate='[]'
          qualification_run_id=''
          for line in "${lines[@]}"; do
            tip="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${line}" --jq '.object.sha')"
            case "$line" in
              mingw-8.10) line_version=8.10.2; line_revision=1 ;;
              mingw-8.8) line_version=8.8.3; line_revision=1 ;;
              mingw-7.4) line_version=7.4.11; line_revision=1 ;;
              mingw-7.2) line_version=7.2.16; line_revision=2 ;;
              mingw-6.2) line_version=6.2.24; line_revision=2 ;;
            esac
            tip_version="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/src/version.h?ref=${tip}" --jq '.content' | tr -d '\n' | base64 -d | sed -n 's/^#define REDIS_VERSION "\([^"]*\)"/\1/p')"
            tip_revision="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/packaging/mingw/windows-revision?ref=${tip}" --jq '.content' | tr -d '\n' | base64 -d)"
            [[ "$tip_version" == "$line_version" && "$tip_revision" == "$line_revision" ]] || {
              echo "$line is not at the required source version and Windows revision" >&2; exit 1;
            }
            runs="$(gh api --paginate --slurp "/repos/${GITHUB_REPOSITORY}/actions/workflows/full-validation.yml/runs?branch=${line}&event=push&per_page=100")"
            qualified="$(jq -r --arg tip "$tip" '[.[].workflow_runs[]? | select(.head_sha == $tip and .conclusion == "success")] | sort_by(.run_number) | last // empty | [.id, .head_sha] | @tsv' <<<"$runs")"
            [[ -n "$qualified" ]] || { echo "no successful Full Windows qualification for current tip $line ($tip)" >&2; exit 1; }
            run_id="${qualified%%$'\t'*}"
            if [[ "$line" == "$branch" ]]; then
              qualification_run_id="$run_id"
            fi
            record="$(jq -cn --arg branch "$line" --arg sha "$tip" --arg run "$run_id" '{branch:$branch,source_sha:$sha,run_id:($run|tonumber),workflow:"Full Windows qualification"}')"
            gate="$(jq -c --argjson record "$record" '. + [$record]' <<<"$gate")"
          done
          [[ "$qualification_run_id" =~ ^[1-9][0-9]*$ ]] || {
            echo "could not identify the successful qualification run for $branch" >&2
            exit 1
          }
          artifact_name="windows-qualification-${source_sha}"
          artifacts="$(gh api --paginate --slurp "/repos/${GITHUB_REPOSITORY}/actions/runs/${qualification_run_id}/artifacts?per_page=100")"
          jq -e --arg name "$artifact_name" '[.[].artifacts[]? | select(.name == $name and .expired == false)] | length == 1' <<<"$artifacts" >/dev/null || {
            echo "successful qualification run $qualification_run_id does not have an unexpired $artifact_name artifact" >&2
            exit 1
          }
          printf 'source_branch=%s\n' "$branch" >> "$GITHUB_OUTPUT"
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          printf 'source_tree=%s\n' "$source_tree" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'gate_json=%s\n' "$(jq -c --arg policy 'all five maintained-line tips passed Full Windows qualification' '{policy:$policy,lines:.}' <<<"$gate")" >> "$GITHUB_OUTPUT"
          printf 'qualification_run_id=%s\n' "$qualification_run_id" >> "$GITHUB_OUTPUT"
          printf 'artifact_name=%s\n' "$artifact_name" >> "$GITHUB_OUTPUT"

  attest:
    # Keep the release-branch guard when the hold is lifted.
    if: ${{ false && startsWith(github.ref, 'refs/heads/release-') }}
    name: Attest qualified release package and SBOM
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out exact source verification scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false
      - name: Download qualified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.preflight.outputs.artifact_name }}
          run-id: ${{ needs.preflight.outputs.qualification_run_id }}
          github-token: ${{ github.token }}
          path: release-assets
      - name: Bind maintained-line barrier to reused evidence
        env:
          QUALIFICATION_GATE: ${{ needs.preflight.outputs.gate_json }}
        run: |
          set -euo pipefail
          jq -e --argjson gate "$QUALIFICATION_GATE" '
            ($gate.policy | type == "string") and
            ($gate.lines | type == "array" and length == 5)
          ' <<<"$QUALIFICATION_GATE" >/dev/null
          tmp="$(mktemp)"
          jq --argjson gate "$QUALIFICATION_GATE" \
            '.qualification.maintained_lines = $gate' \
            release-assets/release-evidence.json > "$tmp"
          mv "$tmp" release-assets/release-evidence.json
      - name: Verify qualified assets before attestation
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          RELEASE_SOURCE_TREE: ${{ needs.preflight.outputs.source_tree }}
          RELEASE_SOURCE_BRANCH: ${{ needs.preflight.outputs.source_branch }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_REVISION: ${{ needs.preflight.outputs.revision }}
          RELEASE_QUALIFICATION_RUN_ID: ${{ needs.preflight.outputs.qualification_run_id }}
        run: bash scripts/verify-release-assets.sh release-assets
      - name: Create SLSA build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-assets/*.zip
      - name: Create SPDX SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-assets/*.zip
          sbom-path: release-assets/sbom.spdx.json

  publish:
    # Keep the release-branch guard when the hold is lifted.
    if: ${{ false && startsWith(github.ref, 'refs/heads/release-') }}
    name: Create immutable GitHub release
    needs: [preflight, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact source verification scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false
      - name: Download qualified and attested release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.preflight.outputs.artifact_name }}
          run-id: ${{ needs.preflight.outputs.qualification_run_id }}
          github-token: ${{ github.token }}
          path: release-assets
      - name: Bind maintained-line barrier to reused evidence
        env:
          QUALIFICATION_GATE: ${{ needs.preflight.outputs.gate_json }}
        run: |
          set -euo pipefail
          jq -e --argjson gate "$QUALIFICATION_GATE" '
            ($gate.policy | type == "string") and
            ($gate.lines | type == "array" and length == 5)
          ' <<<"$QUALIFICATION_GATE" >/dev/null
          tmp="$(mktemp)"
          jq --argjson gate "$QUALIFICATION_GATE" \
            '.qualification.maintained_lines = $gate' \
            release-assets/release-evidence.json > "$tmp"
          mv "$tmp" release-assets/release-evidence.json
      - name: Verify assets and publish without moving an existing tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          RELEASE_SOURCE_TREE: ${{ needs.preflight.outputs.source_tree }}
          RELEASE_QUALIFICATION_RUN_ID: ${{ needs.preflight.outputs.qualification_run_id }}
          RELEASE_SOURCE_BRANCH: ${{ needs.preflight.outputs.source_branch }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_REVISION: ${{ needs.preflight.outputs.revision }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          source_sha="$RELEASE_SOURCE_SHA"
          source_branch="$RELEASE_SOURCE_BRANCH"
          version="$RELEASE_VERSION"
          revision="$RELEASE_REVISION"
          bash scripts/verify-release-assets.sh release-assets
          mapfile -d '' -t assets < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)
          mapfile -t barrier_lines < <(
            jq -r '.qualification.maintained_lines.lines[] | [.branch, .source_sha, (.run_id | tostring)] | @tsv' \
              release-assets/release-evidence.json
          )
          (( ${#barrier_lines[@]} == 5 )) || { echo 'maintained-line barrier does not contain five lines' >&2; exit 1; }
          declare -A seen_lines=()
          for record in "${barrier_lines[@]}"; do
            IFS=$'\t' read -r line qualified_sha run_id <<< "$record"
            [[ "$qualified_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid qualified SHA for $line" >&2; exit 1; }
            [[ "$run_id" =~ ^[1-9][0-9]*$ ]] || { echo "invalid qualification run ID for $line" >&2; exit 1; }
            case "$line" in
              mingw-8.10|mingw-8.8|mingw-7.4|mingw-7.2|mingw-6.2) ;;
              *) echo "unexpected maintained line in release evidence: $line" >&2; exit 1 ;;
            esac
            [[ -z "${seen_lines[$line]:-}" ]] || { echo "duplicate maintained line: $line" >&2; exit 1; }
            seen_lines[$line]=1
            current_tip="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${line}" --jq '.object.sha')"
            [[ "$current_tip" == "$qualified_sha" ]] || {
              echo "$line moved from qualified tip $qualified_sha to $current_tip; refusing to publish" >&2
              exit 1
            }
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
              --jq '{head_sha,head_branch,event,conclusion,path}' | \
              jq -e --arg sha "$qualified_sha" --arg branch "$line" \
                '.head_sha == $sha and .head_branch == $branch and .event == "push" and
                 .conclusion == "success" and .path == ".github/workflows/full-validation.yml"' >/dev/null || {
                  echo "recorded qualification run $run_id is no longer a successful push run for $line" >&2
                  exit 1
                }
          done
          if gh release view --repo "$GITHUB_REPOSITORY" "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; refusing to modify an existing release" >&2
            exit 1
          fi
          if gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >"$RUNNER_TEMP/tag.json" 2>/dev/null; then
            echo "tag $tag already exists; refusing to publish around a pre-existing tag" >&2
            exit 1
          fi
          gh release create --repo "$GITHUB_REPOSITORY" "$tag" "${assets[@]}" --target "$source_sha" \
            --title "Redis $version for Windows" \
            --notes-file release-assets/TEST-REPORT.md
          final_target="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha')"
          [[ "$final_target" == "$source_sha" ]] || { echo "release tag target changed unexpectedly" >&2; exit 1; }
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
            --jq '[.draft, .prerelease, .immutable] | @tsv' > /tmp/release-state.tsv
          IFS=$'\t' read -r draft prerelease immutable < /tmp/release-state.tsv
          [[ "$draft" == false && "$prerelease" == false && "$immutable" == true ]] || {
            echo "release was not published as an immutable normal release (draft=$draft prerelease=$prerelease immutable=$immutable)" >&2
            exit 1
          }
          printf 'RELEASE_IMMUTABLE=%s\n' "$immutable"
          printf 'PUBLISHED_RELEASE_OK tag=%s source=%s\n' "$tag" "$source_sha"
